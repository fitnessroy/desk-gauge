; Desk Gauge — dual round-screen gauge (Claude usage + Bambu Lab printer)
;
;   pio run -e esp32dev -t upload          ESP32 DevKit V1, no screens (web preview only)
;   pio run -e esp32s3  -t upload          ESP32-S3 DevKitC-1 N16R8 + 2× ST77916 360x360 round screens
;   pio device monitor

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ESP32 DevKit V1 (WROOM-32, no PSRAM). No panels attached: the UI is rendered
; into an off-screen sprite and served at http://desk-gauge.local/
[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHAS_PANELS=0

; ESP32-S3 DevKitC-1 N16R8 (16MB QIO flash, 8MB octal PSRAM) with two ST77916 QSPI round panels.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHAS_PANELS=1
    -DLGFX_USE_QSPI
    -DPANEL_W=360
    -DPANEL_H=360
