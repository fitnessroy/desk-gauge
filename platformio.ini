; Desk Gauge — round-screen Claude usage gauge (optional second screen for a Bambu Lab printer)
;
;   pio run -e esp32dev -t upload          ESP32 DevKit V1, no screens (web preview only)
;   pio run -e esp32s3  -t upload          ESP32-S3 DevKitC-1 N16R8 + ST77916 360x360 round screen(s)
;   GAUGE_PASS=... pio run -e esp32s3_ota -t upload   same S3 board, over Wi-Fi
;   pio run -e esp32s3_n8r2 -t upload      ESP32-S3 DevKitC-1 N8R2 (8MB flash, 2MB quad PSRAM), same screens
;   (no serial monitor on the S3: opening its USB port can drop it into download mode)

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ESP32 DevKit V1 (WROOM-32, no PSRAM). No panels attached: the UI is rendered
; into an off-screen sprite and served at http://desk-gauge.local/
[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHAS_PANELS=0

; ESP32-S3 DevKitC-1 N16R8 (16MB QIO flash, 8MB octal PSRAM) with ST77916 QSPI round panel(s).
; Panel 1 (printer) is only used when the printer is set in secrets.h.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHAS_PANELS=1
    -DPANEL_W=360
    -DPANEL_H=360

; ESP32-S3 DevKitC-1 N8R2 (8MB flash, 2MB quad PSRAM). Same pins; a 360x360 frame fits in 2MB PSRAM.
[env:esp32s3_n8r2]
extends = env:esp32s3
board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Same board, flashed over Wi-Fi once the OTA firmware is on it. The password is the web page
; password (WEB_PASS in secrets.h), passed in the environment:
;   GAUGE_PASS='...' pio run -e esp32s3_ota -t upload --upload-port 192.168.1.46
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = desk-gauge.local
upload_flags =
    --auth=${sysenv.GAUGE_PASS}
